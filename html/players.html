<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — World Cup 2026</title>
  <meta name="description" content="Live match results for ESportsBattle FC26 Satellite 2026 tournament." />
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/players.css" />
</head>
<body id="top">

  <div class="bg-fixed"></div>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo">
        <img src="../assets/logo.svg" alt="Sportsbattle" />
      </a>

      <nav>
        <a href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
            <path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/>
          </svg>
          <span class="nav-about">ABOUT</span>
        </a>
        <a href="teams.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/>
          </svg>
          <span class="nav-teams">TEAMS</span>
        </a>
        <a href="players.html" style="color: var(--primary);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <span class="nav-players">RESULTS</span>
        </a>
        <a href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>
            <path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/>
          </svg>
          <span class="nav-news">NEWS</span>
        </a>
        <a href="#"><span class="nav-terms">TERMS AND CONDITIONS</span></a>
      </nav>

      <div class="header-actions">
        <div class="social-links">
          <a href="https://twitch.tv" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Twitch">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 2H3v16h5v4l4-4h5l4-4V2z"/><path d="M11 7v5M16 7v5"/>
            </svg>
          </a>
          <a href="https://www.facebook.com/ESportsBattle.Official" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Facebook">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
            </svg>
          </a>
          <a href="https://www.instagram.com/esportsbattle.official" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Instagram">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
              <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
            </svg>
          </a>
          <a href="https://www.youtube.com/channel/UCQxv_xu6lXhLHAv264U875g" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="YouTube">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.54C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/>
              <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/>
            </svg>
          </a>
        </div>
        <div class="divider"></div>
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="EN">EN</button>
          <button class="lang-btn" data-lang="UA">UA</button>
        </div>
      </div>
    </div>
  </header>

  <section class="results-hero">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>FC26 ESB Satellite 2026</span>
    </div>
    <h1>Match <span>Results</span></h1>
    <p>Updated automatically whenever the tournament sheet changes.</p>

    <div class="view-tabs">
      <button class="view-tab active" data-view="leagues">Leagues</button>
      <button class="view-tab" data-view="results">Results</button>
    </div>
  </section>

  <section class="filter-section container" id="filterSection" style="display:none">
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-filter="all">All</button>
    </div>
    <div class="range-filters">
      <div class="range-group">
        <label>Date from</label>
        <input type="date" id="dateFrom" />
      </div>
      <div class="range-group">
        <label>Date to</label>
        <input type="date" id="dateTo" />
      </div>
      <div class="range-group">
        <label>Time from</label>
        <input type="time" id="timeFrom" />
      </div>
      <div class="range-group">
        <label>Time to</label>
        <input type="time" id="timeTo" />
      </div>
      <button class="clear-btn" id="clearFilters">Clear</button>
    </div>
  </section>

  <section class="results-section container" id="resultsSection" style="display:none">
    <div class="results-count" id="resultsCount"></div>
    <div class="results-grid-inner" id="resultsGrid"></div>
    <div class="pagination" id="pagination"></div>
  </section>

  <section class="leagues-section container" id="leaguesSection">
    <div id="leaguesContainer"></div>
  </section>

  <footer>
    <span>© 2026 ESportsBattle. The largest esports platform. esportsbattle.com</span>
  </footer>

  <div class="player-modal" id="playerModal">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card">
      <button class="modal-close" id="modalClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <button class="scroll-top" id="scrollTopBtn" aria-label="Scroll to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <script>
    const scrollBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => {
      scrollBtn.classList.toggle('visible', window.scrollY > 300);
    }, { passive: true });
  </script>
  <script src="../js/players.js"></script>
</body>
</html>
